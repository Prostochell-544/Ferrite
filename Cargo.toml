# The mod's crate: the launcher links it into the game and gives dependent mods a path to it
# under the alias `ferrite`. The launcher refuses `[workspace]` and accepts sources only under
# `src/`, so the five crates live in `src/crates/` as path dependencies.
[package]
name = "ferrite"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
publish = false
description = "Ferrite: the industrial API for Horizon mods (energy, items, fluids, recipes)"

[dependencies]
# The launcher points this at the Horizon source it builds the game from.
horizon-mod-api = { git = "https://github.com/arismoko/horizon", rev = "514ecf9a966cdf2bc4f81f091827d81767756fd9" }
ferrite-api = { path = "src/crates/ferrite-api" }
ferrite-items = { path = "src/crates/ferrite-items" }
ferrite-energy = { path = "src/crates/ferrite-energy" }
ferrite-fluids = { path = "src/crates/ferrite-fluids" }
ferrite-recipes = { path = "src/crates/ferrite-recipes" }
